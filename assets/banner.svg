<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="YQT: a native YouTube Music client">
  <title>YQT — a native YouTube Music client</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a26"/>
      <stop offset="0.55" stop-color="#142638"/>
      <stop offset="1" stop-color="#1b3550"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#1f78b4"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22394d"/>
      <stop offset="1" stop-color="#14202c"/>
    </linearGradient>
    <rect id="tooth" x="112" y="10" width="32" height="46" rx="9"/>
    <!-- the logo, as a reusable 256×256 symbol -->
    <g id="logo">
      <g fill="url(#body)">
        <use href="#tooth"/>
        <use href="#tooth" transform="rotate(30 128 128)"/>
        <use href="#tooth" transform="rotate(60 128 128)"/>
        <use href="#tooth" transform="rotate(90 128 128)"/>
        <use href="#tooth" transform="rotate(120 128 128)"/>
        <use href="#tooth" transform="rotate(150 128 128)"/>
        <use href="#tooth" transform="rotate(180 128 128)"/>
        <use href="#tooth" transform="rotate(210 128 128)"/>
        <use href="#tooth" transform="rotate(240 128 128)"/>
        <use href="#tooth" transform="rotate(270 128 128)"/>
        <use href="#tooth" transform="rotate(300 128 128)"/>
        <use href="#tooth" transform="rotate(330 128 128)"/>
      </g>
      <circle cx="128" cy="128" r="98" fill="url(#body)"/>
      <circle cx="128" cy="128" r="72" fill="url(#face)"/>
      <circle cx="128" cy="128" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
      <path d="M110 94 L110 162 L168 128 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- soft equaliser bars along the bottom edge -->
  <g fill="#4fc3f7" fill-opacity="0.10">
    <rect x="640" y="520" width="26" height="120" rx="6"/><rect x="682" y="470" width="26" height="170" rx="6"/>
    <rect x="724" y="500" width="26" height="140" rx="6"/><rect x="766" y="430" width="26" height="210" rx="6"/>
    <rect x="808" y="490" width="26" height="150" rx="6"/><rect x="850" y="540" width="26" height="100" rx="6"/>
    <rect x="892" y="450" width="26" height="190" rx="6"/><rect x="934" y="510" width="26" height="130" rx="6"/>
    <rect x="976" y="420" width="26" height="220" rx="6"/><rect x="1018" y="480" width="26" height="160" rx="6"/>
    <rect x="1060" y="530" width="26" height="110" rx="6"/><rect x="1102" y="460" width="26" height="180" rx="6"/>
    <rect x="1144" y="505" width="26" height="135" rx="6"/><rect x="1186" y="550" width="26" height="90" rx="6"/>
  </g>

  <use href="#logo" transform="translate(110 150) scale(1.35)"/>

  <g font-family="'Noto Sans','Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#ffffff">
    <text x="520" y="290" font-size="132" font-weight="700" letter-spacing="-3">YQT</text>
    <text x="524" y="352" font-size="36" font-weight="400" fill="#cfe9f8">A native YouTube Music client</text>
    <text x="524" y="412" font-size="26" font-weight="400" fill="#8fb6cf">Synced lyrics · Equalizer · Offline downloads</text>
    <text x="524" y="470" font-size="24" font-weight="600" fill="#4fc3f7">Rust  ·  Qt 6  ·  Kirigami</text>
  </g>
</svg>
