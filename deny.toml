# cargo-deny policy for ytm (GPL-3.0-only).  Run: cargo deny check advisories licenses bans sources
[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Each ignore needs a written reason.
ignore = [
    # zbus 5.x pulls in zbus_names / zvariant / zvariant_derive, which upstream merged into `zbus` 6.0.
    # These are "unmaintained" notices, not vulnerabilities, and the only fix is the zbus 5 -> 6 major
    # upgrade (used by src/mpris.rs and the W8 platform adapters). Re-check after that migration.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; needs zbus 5->6 major upgrade (mpris/W8), no vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; needs zbus 5->6 major upgrade (mpris/W8), no vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; needs zbus 5->6 major upgrade (mpris/W8), no vulnerability" },
]

[licenses]
version = 2
# Everything here is compatible with distributing a GPL-3.0-only binary.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    # webpki-roots: the bundled Mozilla CA list that makes TLS self-contained (no system trust store needed).
    # A permissive *data* licence, fine to redistribute inside a GPL binary.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The list is deliberately a little wider than today's tree (audio/image crates often need ISC, CC0, ...).
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# The app is self-contained: TLS is rustls (pure Rust), never the system's OpenSSL. Keep it that way –
# a dependency that re-enables `default-tls`/`native-tls` would make the app depend on a system library again.
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
