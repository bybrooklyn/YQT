[package]
name = "ytm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A tiny native YouTube Music client (Rust, Qt 6, Kirigami)"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
rustypipe = { version = "0.11", features = ["userdata"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
serde_json = "1"
reqwest = "0.12"
rand = "0.9"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha1 = "0.11.0"
aes = "0.9.4"
cbc = "0.2.1"
cipher = { version = "0.5", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
aes-gcm = "0.10"
base64 = "0.22"

# Linux-only: MPRIS over D-Bus
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Windows-only: DPAPI to unwrap the browser cookie key
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
